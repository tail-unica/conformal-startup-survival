
paths:
  # Bias-controlled dataset from tail-unica/startup-survival (data/processed/dataset_controlled.csv)
  dataset: "data/dataset_controlled.csv"

time_window: 7
last_year: 2024
random_seed: 12

train_frac: 0.5
calibration_frac: 0.2
validation_frac: 0.1
test_frac: 0.2

frequency_encoding:
  columns: ["HQCountry", "PrimaryIndustrySector"] # Categorical columns, frequency-encoded on the training split
  min_frequency: 0.05 # Training share below which a category is pooled into other_label
  other_label: "Others"

conformal:
  enabled: true
  alpha: [0.05, 0.1, 0.15, 0.20, 0.25] # target-risk grid for the FNR
  seeds: 
    distribution: int_uniform
    min: 1
    max: 21           # cal/test re-splits for the robustness check

