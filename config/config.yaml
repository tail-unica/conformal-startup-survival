# --- Best found hyperparameters  ---
sweep_settings:
  method: grid
  metric:
    name: F1_val
    goal: maximize
  parameters:
    model_type:
      values: ["rf","lgb","mlp","tabpfn"]
      # values: ["rf","lgb","mlp","dt","lr","svm","tabpfn"]  # weaker families, excluded
    # RF
    rf_n_estimators:
      values: [200]
    rf_max_depth:
      values: [15]
    rf_min_samples_leaf:
      values: [9]
    # LGB
    lgb_n_estimators:
      values: [300]
    lgb_max_depth:
      values: [5]
    learning_rate:
      values: [0.03092792034710772]
    min_child_weight:
      values: [20]
    subsample:
      values: [0.4]
    colsample_bytree:
      values: [1]
    reg_alpha:
      values: [7.471515240794344]
    reg_lambda:
      values: [3.0246578811237925]
    # DT
    dt_max_depth:
      values: [5]
    dt_min_samples_leaf:
      values: [2]
    dt_min_samples_split:
      values: [9]
    dt_criterion:
      values: ["entropy"]
    # LR
    lr_C:
      values: [0.29719610165875604]
    lr_penalty:
      values: ["l2"]
    # MLP
    hidden_sizes:
      values: ["512,256,128"]
    mlp_learning_rate:
      values: [0.006481694307849973]
    dropout_rate:
      values: [0.3]
    weight_decay:
      values: [0.00012295217130781902]
    batch_size:
      values: [256]
    # SVM
    svm_C:
      values: [0.7]
    svm_gamma:
      values: ["scale"]
    # TabPFN
    tabpfn_n_estimators:
      values: [8]
